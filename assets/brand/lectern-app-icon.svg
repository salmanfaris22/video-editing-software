<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Lectern app icon (dark)</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1C2030"/>
      <stop offset="1" stop-color="#0B0C10"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.32" cy="0.28" r="0.75">
      <stop offset="0" stop-color="#7C8CFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7C8CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B4BDFF"/>
      <stop offset="0.55" stop-color="#7C8CFF"/>
      <stop offset="1" stop-color="#5566F0"/>
    </linearGradient>
    <radialGradient id="dot" cx="0.38" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#FF8A95"/>
      <stop offset="0.6" stop-color="#FF4D5E"/>
      <stop offset="1" stop-color="#E0283B"/>
    </radialGradient>
    <filter id="glow" x="-1" y="-1" width="3" height="3">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="shadow" x="-0.3" y="-0.3" width="1.6" height="1.6">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <!-- Cuts in the foot of the L: the timeline clips. -->
    <mask id="cuts">
      <rect width="1024" height="1024" fill="#fff"/>
      <rect x="508" y="560" width="18" height="140" fill="#000"/>
      <rect x="604" y="560" width="18" height="140" fill="#000"/>
    </mask>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#tile)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#halo)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="3"/>
  <!-- The L -->
  <path filter="url(#shadow)" mask="url(#cuts)" fill="url(#mark)"
        d="M320 330 a64 64 0 0 1 128 0 V566 H700 a64 64 0 0 1 0 128 H384 a64 64 0 0 1 -64 -64 Z"/>
  <!-- Record dot with pulse ring -->
  <circle cx="652" cy="356" r="92" fill="#FF4D5E" opacity="0.55" filter="url(#glow)"/>
  <circle cx="652" cy="356" r="124" fill="none" stroke="#FF4D5E" stroke-opacity="0.28" stroke-width="10"/>
  <circle cx="652" cy="356" r="84" fill="url(#dot)"/>
  <circle cx="626" cy="328" r="22" fill="#FFFFFF" opacity="0.22"/>
</svg>
