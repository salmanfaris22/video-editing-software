name: Windows app

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "src/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "vcpkg.json"
      - ".github/workflows/windows-app.yml"

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git C:/vcpkg
          C:/vcpkg/bootstrap-vcpkg.bat

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.2"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtshadertools

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build/win -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DQt6_DIR="$env:Qt6_DIR" `
            -DLECTERN_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build/win --target lectern

      - name: Package
        shell: pwsh
        run: |
          cmake --install build/win --prefix dist/Lectern --component app
          cmake --build build/win --target package

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Lectern-windows-x64
          path: build/win/package/*.zip
